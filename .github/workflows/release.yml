name: Release

# Pushing a tag like v0.3.0 builds a signed APK and publishes it as a GitHub release.
# Installed copies of Budgeter see the new release and offer to update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.BUDGETER_KEYSTORE_B64 }}
        run: |
          # Never publish an APK signed with a throwaway key: installed apps couldn't update to it.
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::BUDGETER_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          BUDGETER_KEYSTORE: ${{ runner.temp }}/release.jks
          BUDGETER_KEYSTORE_PASSWORD: ${{ secrets.BUDGETER_KEYSTORE_PASSWORD }}
          BUDGETER_KEY_ALIAS: budgeter
          BUDGETER_KEY_PASSWORD: ${{ secrets.BUDGETER_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "budgeter-${GITHUB_REF_NAME}.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "budgeter-${GITHUB_REF_NAME}.apk" --title "Budgeter $GITHUB_REF_NAME" --generate-notes
